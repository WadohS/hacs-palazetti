# Configuration Lovelace pour 2 poêles Palazzetti
# Poêle 1 : climate.palazzetti
# Poêle 2 : climate.ginger

type: vertical-stack
cards:
  # ==========================================
  # POÊLE 1 - PALAZZETTI
  # ==========================================
  - type: custom:palazzetti-card
    climate_entity: climate.palazzetti
    power_entity: number.palazzetti_power
    name: Poêle Palazzetti
    
  # ==========================================
  # POÊLE 2 - GINGER
  # ==========================================
  - type: custom:palazzetti-card
    climate_entity: climate.ginger
    power_entity: number.ginger_power
    name: Poêle Ginger


# ==========================================
# ALTERNATIVE : Disposition horizontale (côte à côte)
# ==========================================
# Décommenter pour afficher les 2 poêles côte à côte sur tablette/desktop

