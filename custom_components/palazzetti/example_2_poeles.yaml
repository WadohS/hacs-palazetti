# ==========================================
# NOTES IMPORTANTES
# ==========================================
# 
# 1. Vérifier les noms des entités number :
#    - Aller dans Home Assistant > Outils développeur > États
#    - Chercher "palazzetti" et "ginger"
#    - Noter les noms exacts des entités number (puissance)
#    - Exemples possibles :
#      * number.palazzetti_power
#      * number.palazzetti_puissance
#      * number.ginger_power
#      * number.ginger_puissance
#
# 2. Si les noms sont différents, modifier dans la config :
#    power_entity: number.VOTRE_NOM_ICI
#
# 3. Personnalisation des noms affichés :
#    - Changer "name: Poêle Palazzetti" par ce que vous voulez
#    - Exemples : "Salon", "Bureau", "Cuisine", etc.
#
# 4. Installation du fichier JavaScript :
#    - Placer palazzetti-card.js dans :
#      /config/www/community/palazzetti-card/palazzetti-card.js
#    - Ajouter la ressource dans Configuration > Tableaux de bord > Ressources :
#      URL: /local/community/palazzetti-card/palazzetti-card.js
#      Type: Module JavaScript
